<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Filter</title>

    <!-- CSS (Design) -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f8f6;
            padding: 30px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .filter-box {
            margin-bottom: 25px;
        }

        select {
            padding: 8px;
            font-size: 16px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 500px;
        }

        .product {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
        }

        .price {
            font-weight: bold;
            margin: 8px 0;
        }

        .tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            
        }

    </style>
</head>
<body>

    <h1>Product Filter</h1>

    <!-- Filter Dropdown -->
    <div class="filter-box">
        <label>Filter by: </label>
        <select onchange="filterProducts(this.value)">
            <option value="all">All Products</option>
            <option value="electronics">Electronics</option>
            <option value="clothing">Clothing</option>
        </select>
    </div>

    <!-- Product Cards -->
    <div class="products-wrapper">
    <div class="products" id="productList"></div>
</div>


    <!-- JavaScript (Logic) -->
    <script>
    
        const products = [
            { name: "Wireless Headphones", price: 129.99, category: "electronics" },
            { name: "Cotton T-Shirt", price: 24.99, category: "clothing" },
            { name: "Bluetooth Speaker", price: 89.99, category: "electronics" },
            { name: "Denim Jeans", price: 59.99, category: "clothing" }
        ];

        const productList = document.getElementById("productList");

        
        function displayProducts(items) {
            productList.innerHTML = "";

            items.forEach(product => {
                const div = document.createElement("div");
                div.className = "product";

                div.innerHTML = `
                    <h3>${product.name}</h3>
                    <p class="price">$${product.price}</p>
                    <span class="tag ${product.category}">
                        ${product.category}
                    </span>
                `;

                productList.appendChild(div);
            });
        }

        
        function filterProducts(category) {
            if (category === "all") {
                displayProducts(products);
            } else {
                const filtered = products.filter(
                    product => product.category === category
                );
                displayProducts(filtered);
            }
        }

        displayProducts(products);
    </script>

</body>
</html>
